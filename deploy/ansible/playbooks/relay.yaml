---
# Deploy / redeploy: run deploy/build.sh first, then this playbook.
- name: Deploy croc relay
  hosts: relay
  become: true
  vars_files:
    - ../vars.yaml
  vars:
    iperf3_port: 5201 # must match the AllowIperf3 rule in deploy/terraform/main.tf

  tasks:
    - name: Baseline tools
      apt:
        name: [curl, htop, net-tools, iperf3]
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Service user
      user:
        name: croc-relay
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Install croc binary
      copy:
        src: "{{ croc_binary }}"
        dest: /usr/local/bin/croc
        mode: "0755"
      notify: restart croc-relay

    - name: systemd unit
      template:
        src: ../templates/croc-relay.service.j2
        dest: /etc/systemd/system/croc-relay.service
        mode: "0600" # contains the relay password
      notify: restart croc-relay

    - name: Enable and start relay
      systemd:
        name: croc-relay
        enabled: true
        state: started
        daemon_reload: true

    # iperf3 server so anyone can measure their line to the relay with
    # `iperf3 -c <ip>` (upload) and `iperf3 -c <ip> -R` (download).
    # Set iperf3_enabled: false in vars.yaml to stop and disable it.
    - name: iperf3 systemd unit
      template:
        src: ../templates/iperf3.service.j2
        dest: /etc/systemd/system/iperf3.service
        mode: "0644"
      notify: restart iperf3
      when: iperf3_enabled | default(true) | bool

    - name: Enable and start iperf3
      systemd:
        name: iperf3
        enabled: true
        state: started
        daemon_reload: true
      when: iperf3_enabled | default(true) | bool

    - name: Stop and disable iperf3 when turned off
      systemd:
        name: iperf3
        enabled: false
        state: stopped
      failed_when: false # fine if the unit was never installed
      when: not (iperf3_enabled | default(true) | bool)

  handlers:
    - name: restart croc-relay
      systemd:
        name: croc-relay
        state: restarted
        daemon_reload: true

    - name: restart iperf3
      systemd:
        name: iperf3
        state: restarted
        daemon_reload: true
