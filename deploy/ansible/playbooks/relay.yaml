---
# Deploy / redeploy: run deploy/build.sh first, then this playbook.
- name: Deploy croc relay
  hosts: relay
  become: true
  vars_files:
    - ../vars.yaml

  tasks:
    - name: Baseline tools
      apt:
        name: [curl, htop, net-tools, iperf3]
        state: present
        update_cache: yes
        cache_valid_time: 3600

    - name: Service user
      user:
        name: croc-relay
        system: true
        shell: /usr/sbin/nologin
        create_home: false

    - name: Install croc binary
      copy:
        src: "{{ croc_binary }}"
        dest: /usr/local/bin/croc
        mode: "0755"
      notify: restart croc-relay

    - name: systemd unit
      template:
        src: ../templates/croc-relay.service.j2
        dest: /etc/systemd/system/croc-relay.service
        mode: "0600" # contains the relay password
      notify: restart croc-relay

    - name: Enable and start relay
      systemd:
        name: croc-relay
        enabled: true
        state: started
        daemon_reload: true

  handlers:
    - name: restart croc-relay
      systemd:
        name: croc-relay
        state: restarted
        daemon_reload: true
